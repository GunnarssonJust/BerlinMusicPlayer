plugins {
    id 'com.android.application'
}

android {
    namespace 'com.berlinmusicplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.berlinmusicplayer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Android Core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Media / Musik-Wiedergabe
    implementation 'androidx.media:media:1.7.0'

    // ViewPager2 (für Tabs in MainActivity)
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Gson (für Playlist-Speicherung in MusicService)
    implementation 'com.google.code.gson:gson:2.10.1'

    // Glide (für Bilder/Album-Art)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.activity:activity:1.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // FastScroll RecyclerView
    implementation 'com.simplecityapps:recyclerview-fastscroll:2.0.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
